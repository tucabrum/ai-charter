[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-charter"
version = "0.1.0"
description = "Gera charts de Clone Hero / YARG automaticamente a partir de um arquivo de música"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "librosa>=0.10",
    "soundfile>=0.12",
    "mido>=1.3",
]

[project.optional-dependencies]
# Separação de stems com IA (baixa o PyTorch, que é grande).
separation = ["demucs>=4.0"]
# Transcrição automática da letra (--auto-lyrics).
lyrics = ["faster-whisper>=1.0"]
dev = ["pytest>=7"]

[project.scripts]
ai-charter = "ai_charter.cli:main"
ai-charter-compare = "ai_charter.compare:main"
ai-charter-critic = "ai_charter.critic:main"
ai-charter-view = "ai_charter.view:main"
ai-charter-revise = "ai_charter.revision:main"
ai-charter-bench = "ai_charter.bench:main"

[tool.setuptools.packages.find]
include = ["ai_charter*"]

[tool.setuptools.package-data]
ai_charter = ["default_rules.toml", "viewer/*.html"]
