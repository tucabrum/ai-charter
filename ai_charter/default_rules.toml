# =============================================================================
# Regras de charting do ai-charter
#
# Este arquivo define COMO as charts são geradas. Para personalizar, copie-o,
# altere só o que quiser e rode:  ai-charter musica.flac --rules minhas_regras.toml
# (valores que você não mudar continuam vindo deste arquivo).
#
# Unidade "beats" = batidas (semínimas). 1.0 = uma batida, 0.5 = colcheia,
# 0.25 = semicolcheia. "grid" = quantas subdivisões por batida são permitidas
# (4 = semicolcheias, 2 = colcheias, 1 = só nas batidas).
# =============================================================================

[general]
resolution = 192               # ticks por batida no arquivo .chart (padrão do Clone Hero)
allow_triplets = true          # permite notas em quiálteras (tercinas) no Expert
starpower_every_measures = 8   # uma frase de Star Power a cada N compassos
starpower_phrase_beats = 4     # duração de cada frase de Star Power (em batidas)
drum_fill_every_measures = 4   # bateria: uma virada de ativação do Star Power a cada N compassos (0 = nenhuma)
min_stem_energy = 0.03         # stems mais fracos que isso (relativo à mix) não viram chart
sections = true                # marca seções (Section 1, 2...) para o modo prática
section_seconds = 25.0         # tamanho médio desejado de cada seção

# ---------------------------------------------------------------------------
# Detecção de notas em instrumentos com altura (guitarra, baixo, teclado)
# ---------------------------------------------------------------------------
[detection.guitar]
fmin = "E2"            # nota mais grave procurada
octaves = 5            # quantas oitavas acima de fmin analisar
onset_method = "both"  # como achar ataques: "energy" (estalo), "pitch" (troca de nota) ou "both"
onset_delta = 0.04     # sensibilidade dos ataques (menor = detecta mais notas)
min_rms_db = -35.0     # ignora ataques mais baixos que isso (ruído / vazamento)
chord_ratio = 0.65     # quão forte a 2ª nota precisa ser para virar acorde (0-1)
release_ratio = 0.35   # a nota "acaba" quando o volume cai abaixo disso × pico
lane_window = 8        # nº de notas vizinhas usadas para decidir a lane pelo contorno
recognize_chords = true      # reconhece acordes (C, Am, G5...) pelo conjunto de notas que soam
chord_fifth_ratio = 0.3      # acorde se a quinta (+7) soa com pelo menos isso da nota grave...
chord_third_ratio = 0.5      # ...ou a terça com pelo menos isso (ou se o estimador acha 2+ notas)
chord_smoothing = 5          # decide acorde x nota pela maioria das N notas antes e depois
chord_change_margin = 0.08   # tolerância para a troca de acorde cair no tempo (som anterior ainda soando)
power_chord_third_margin = 0.008  # se "maior" e "menor" empatam até aqui, não há terça: é power chord
power_chord_notes = 2        # notas de um power chord na chart (1 = nota simples)
chord_notes = 2              # notas dos outros acordes (maior/menor) na chart: 2 deixa a chart limpa
accent_chord_notes = 3       # acorde de ACENTO (segurado por muito tempo) ganha mais notas
accent_min_beats = 2.0       # quantas batidas o acorde precisa durar para virar acento
allowed_chords = []          # só estes acordes (ex.: ["G", "D", "Em", "C"]); vazio = qualquer um. A --cifra preenche

[detection.bass]
fmin = "E1"
octaves = 4
onset_method = "both"
onset_delta = 0.04
min_rms_db = -35.0
chord_ratio = 0.9
release_ratio = 0.35
lane_window = 8
recognize_chords = false
chord_fifth_ratio = 0.3
chord_third_ratio = 0.5
chord_smoothing = 5
chord_change_margin = 0.08
power_chord_third_margin = 0.008
power_chord_notes = 2
chord_notes = 2
accent_chord_notes = 3
accent_min_beats = 2.0
allowed_chords = []

[detection.keys]
fmin = "A1"
octaves = 6
onset_method = "both"
onset_delta = 0.04
min_rms_db = -35.0
chord_ratio = 0.6
release_ratio = 0.3
lane_window = 8
recognize_chords = true
chord_fifth_ratio = 0.3
chord_third_ratio = 0.5
chord_smoothing = 5
chord_change_margin = 0.08
power_chord_third_margin = 0.008
power_chord_notes = 2
chord_notes = 2
accent_chord_notes = 3
accent_min_beats = 2.0
allowed_chords = []

# ---------------------------------------------------------------------------
# Detecção de bateria: cada peça é encontrada numa faixa de frequência (Hz)
# ---------------------------------------------------------------------------
[drum_detection]
# Como os conversores de bateria para MIDI: primeiro descobre os sons do kit da gravação
# (grupos de golpes com o mesmo espectro), dá nome a cada um e depois marca quando cada som toca.
use_model = true             # usa o modelo treinado com charts oficiais (ai_charter/drum_model.json), se existir
adtof_kick_trust = 0.0       # com o ADTOF: em rajadas (a < 100 ms de um bumbo confirmado), bumbo que ele ouve com pelo menos essa chance entra; 0 = desligado (medido: 0,5 piora a média de 0,750 para 0,745)
onset_delta = 0.07           # sensibilidade dos ataques (menor = acha batidas mais fracas)
min_level = 0.03             # ignora ataques com menos som novo que isso × os 5% mais fortes
max_sounds = 12              # quantos sons diferentes procurar no kit
sound_similarity = 0.9      # quão parecidos (0-1) dois golpes precisam ser para serem o mesmo som
explained_error = 0.35      # um golpe já está explicado se os sons achados o reproduzem com esse erro
min_hits = 3                 # um som do kit precisa aparecer sozinho em pelo menos N golpes
min_share = 0.3              # fração do ataque (nas bandas do som) que ele precisa explicar
threshold = 0.15             # força mínima (0-1) relativa a um golpe típico do mesmo som
kick_max_hz = 95.0           # bumbo: altura (pico nos graves) até aqui; acima é tom
floor_tom_max_hz = 130.0     # tom abaixo disso é o surdo (verde); acima, tons de rack
tom_min_ring = 0.25          # tom ressoa: mantém essa fração do volume ~80 ms depois
snare_min_rattle = 0.3       # caixa: o chiado das esteiras (2-8 kHz) mantém isso ~80 ms depois; tom não
tom_share_in_snare = 0.25    # um som "caixa" com essa fração de golpes sem chiado também é tom (golpe a golpe)
drum_cymbal_air = 0.55       # som de caixa ou tom só leva prato junto com esta fração de energia acima de 6 kHz
cymbal_over_snare = 0.5      # chimbal mais fraco que isso no golpe de uma caixa é chiado das esteiras
hat_over_snare_air = 0.75    # ...a não ser que os agudos (>7 kHz) passem disso × a esteira (2-6 kHz)
weak_share = 0.1             # golpe fraco (ex.: mascarado pelo bumbo): só entra se continuar um padrão
ride_sustain_ratio = 0.15    # prato que ainda soa um pouco ~150-300 ms depois é condução
crash_sustain_ratio = 0.4    # prato que ainda soa muito ~150-300 ms depois é ataque (crash)

# ---------------------------------------------------------------------------
# Várias guitarras (ex.: violão + guitarra solo): qual vira a chart, compasso a compasso
# ---------------------------------------------------------------------------
[guitar_selection]
active_db = -20.0           # guitarra mais de 20 dB abaixo da mais alta conta como "parada"
weight_loudness = 1.0       # peso de ser a mais alta
weight_single_notes = 1.0   # peso de tocar notas simples (solo) em vez de acordes (base)
weight_pitch = 0.5          # peso de tocar mais agudo
switch_cost = 1.5           # custo de trocar de guitarra (maior = troca menos)
inactive_cost = 2.0         # custo de ficar numa guitarra que parou de tocar
min_hold_measures = 2       # depois de trocar, fica pelo menos esse nº de compassos

# ---------------------------------------------------------------------------
# Sanitização: compassos "confusos" (ruído alto + ritmo bagunçado) viram um
# caminho regular (ritmo típico da faixa com um acorde só). Compassos limpos
# nunca são mexidos.
# ---------------------------------------------------------------------------
[sanitize]
enabled = true
noise_ratio = 3.0            # ruído de fundo a partir de quantas vezes o normal da faixa
min_found = 0.9              # menos que isso do ritmo típico encontrado = bagunçado
max_extra = 0.1              # mais que isso de notas fora do ritmo típico = bagunçado
min_groove_measures = 3      # o ritmo típico precisa aparecer em pelo menos N compassos

# ---------------------------------------------------------------------------
# Vocais (precisam de um arquivo de letra: --lyrics letra.txt)
# ---------------------------------------------------------------------------
[vocals]
fmin = "C2"                  # nota mais grave procurada na voz
fmax = "C6"                  # nota mais aguda
min_rms_db = -35.0           # ignora trechos mais baixos que isso (vazamento)
onset_delta = 0.1            # sensibilidade para novos ataques dentro de um trecho cantado
pitch_split_semitones = 0.7  # mudança de afinação que separa duas notas ligadas
min_note_seconds = 0.08      # notas mais curtas que isso são descartadas
phrase_gap_beats = 0.75      # pausa (em batidas) que separa duas frases
sung_min_ratio = 0.6         # linha com menos notas cantadas que isso x sílabas é FALADA (só letra, sem notas)
language = "auto"            # idioma da letra (sílabas e transcrição): "auto" (descobre pela letra), "pt" ou "en"
whisper_model = "small"      # --auto-lyrics: tiny, base, small, medium, large-v3 (maior = melhor e mais lento)

# ---------------------------------------------------------------------------
# Regras por dificuldade - guitarra, baixo e teclado (5 lanes)
#   lanes:          quantas cores usar (5 = G R Y B O, 4 = sem laranja, 3 = G R Y)
#   max_chord:      máximo de notas num acorde
#   min_gap_beats:  menor distância entre duas notas
#   allow_offgrid:  permite notas fora do grid (síncopes rápidas)
#   sustain_min_beats: notas mais curtas que isso não têm sustain
#   allow_hopos:    se false, força todas as notas a serem palhetadas (strum)
#   min_reduction:  fração mínima de notas a remover em relação à dificuldade
#                   acima (0.1 = pelo menos 10% a menos), para nunca ficar igual
# ---------------------------------------------------------------------------
[frets.expert]
lanes = 5
max_chord = 3
min_gap_beats = 0.25
allow_offgrid = true
grid = 4
sustain_min_beats = 0.5
allow_hopos = true
min_reduction = 0.0

[frets.hard]
lanes = 5
max_chord = 2
min_gap_beats = 0.5
allow_offgrid = true
grid = 2
sustain_min_beats = 0.75
allow_hopos = true
min_reduction = 0.1

[frets.medium]
lanes = 4
max_chord = 2
min_gap_beats = 0.5
allow_offgrid = false
grid = 2
sustain_min_beats = 1.0
allow_hopos = false
min_reduction = 0.15

[frets.easy]
lanes = 3
max_chord = 1
min_gap_beats = 1.0
allow_offgrid = false
grid = 1
sustain_min_beats = 1.0
allow_hopos = false
min_reduction = 0.25

# ---------------------------------------------------------------------------
# Regras por dificuldade - bateria (Pro Drums, 4 lanes + bumbo)
#   *_min_gap_beats: menor distância entre duas batidas da mesma peça
#   max_hands:       quantas peças tocadas com as mãos ao mesmo tempo
#   min_reduction:   como na guitarra
# ---------------------------------------------------------------------------
[drums.expert]
kick_min_gap_beats = 0.12     # pedal duplo e rufos em fusa (como nas charts oficiais)
snare_min_gap_beats = 0.12
hihat_min_gap_beats = 0.25
crash = true
max_hands = 2
allow_offgrid = true
grid = 4
min_reduction = 0.0

[drums.hard]
kick_min_gap_beats = 0.5
snare_min_gap_beats = 0.5
hihat_min_gap_beats = 0.5
crash = true
max_hands = 2
allow_offgrid = false
grid = 2
min_reduction = 0.1

[drums.medium]
kick_min_gap_beats = 1.0
snare_min_gap_beats = 0.5
hihat_min_gap_beats = 0.5
crash = true
max_hands = 2                # as charts oficiais usam duas mãos juntas em ~25-30% das notas
allow_offgrid = false
grid = 2
min_reduction = 0.15

[drums.easy]
kick_min_gap_beats = 2.0
snare_min_gap_beats = 1.0
hihat_min_gap_beats = 1.0
crash = true                 # a Harmonix mantém o prato de ataque até no Easy
max_hands = 2                # as charts oficiais usam duas mãos juntas em ~25-30% das notas
allow_offgrid = false
grid = 1
min_reduction = 0.25
